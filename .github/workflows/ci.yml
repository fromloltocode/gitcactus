name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: cargo clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Smoke-test --version and --help (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release
          ./target/release/gitcactus --version
          ./target/release/gitcactus --help

      - name: Smoke-test --version and --help (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          ./target/release/gitcactus.exe --version
          ./target/release/gitcactus.exe --help
