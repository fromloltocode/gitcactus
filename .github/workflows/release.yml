# Release workflow for GitCactus.
#
# Triggered when a version tag like `v0.2.0` is pushed. Builds release
# binaries for common targets and attaches them to the corresponding
# GitHub Release.
#
# This is intentionally minimal — it does NOT yet:
#   - sign binaries
#   - build universal macOS binaries
#   - update the Homebrew formula automatically
#
# See docs/releasing.md for the manual steps that complement this.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF##*/}"
          BIN_PATH="target/${{ matrix.target }}/release/gitcactus"
          OUT_DIR="gitcactus-${VERSION}-${{ matrix.target }}"
          mkdir -p "$OUT_DIR"
          cp "$BIN_PATH" "$OUT_DIR/"
          cp README.md LICENSE "$OUT_DIR/"
          tar -czf "${OUT_DIR}.tar.gz" "$OUT_DIR"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: gitcactus-*.tar.gz
          draft: true
          fail_on_unmatched_files: false
